name: Public safety

# This repository is public. Every push and pull request is checked for
# secrets (gitleaks) and for files or lines that must stay private
# (tooling/scripts/public-check.ts). The pre-push hook runs the same check
# before anything leaves a contributor's machine.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Check the new commits
        env:
          PUBLIC_CHECK_SKIP_IDENTITY: "1"
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$HEAD~1"
          fi
          bun tooling/scripts/public-check.ts --range "$BASE..$HEAD"
