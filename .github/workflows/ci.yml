name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Inherited from the OpenPanel import: the suite still needs Redis and
# ClickHouse (metadata is SQLite/D1 now). These services go away as each part moves to D1, Durable Objects
# and R2 (see docs/adr/0001-architecture-and-product-strategy.md).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run lint:format

      # The dashboard's tsc needs more than Node's default heap on the
      # standard runner (it ran out of memory at 4 GB-ish defaults).
      - name: Run TypeScript checks
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          TYPECHECK_CONCURRENCY: "2"

      - name: Check dependency boundaries
        run: bun run check:deps

      # The Cloudflare platform stores run inside workerd (Miniflare): local,
      # free, no services needed.
      - name: Test Cloudflare platform stores
        run: bun run --filter @flarepanel/platform test:cloudflare

  # packages/core runs one process per file, so it is split across runners.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core 1/3
            directory: packages/core
            command: bun run test --shard=1/3
          - suite: core 2/3
            directory: packages/core
            command: bun run test --shard=2/3
          - suite: core 3/3
            directory: packages/core
            command: bun run test --shard=3/3
          - suite: everything else
            directory: .
            command: bun run test:rest
            migrate: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 23379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 23123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Exercises the real migration runners, which the suite does not: tests apply
      # the flat test/clickhouse-schema.sql, so `migrate:deploy` is the only place
      # Prisma's migrate and the ClickHouse code-migrations actually run. Uses its
      # own databases, never the suite's `openpanel_test`.
      - name: Migrate database
        if: matrix.migrate
        run: bun run migrate:deploy
        env:
          DATABASE_URL: file:.data/ci-migrate.db
          CLICKHOUSE_URL: http://localhost:23123/openpanel
          SELF_HOSTED: "true"

      # Core's preload only pins the URLs so infrastructure-free files run offline, yet many of its database tests
      # assume `openpanel_test` exists, whichever shard they land in.
      - name: Create test databases
        if: matrix.directory == 'packages/core'
        run: bun -e "await (await import('./test/bootstrap-databases.ts')).bootstrapTestDatabases()"

      # No env block, deliberately. Every workspace's test preload pins DATABASE_URL / CLICKHOUSE_URL / REDIS_URL itself;
      # test/bun-preload.ts also creates and migrates the isolated `openpanel_test` databases for the other workspaces.
      # Env set here would be silently overwritten.
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

